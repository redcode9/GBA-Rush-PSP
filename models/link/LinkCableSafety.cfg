SPECIFICATION SafetySpec

CONSTANTS
  MaxTransfers = 3
  InitialTransfer = 2
  SequenceModulus = 3
  EpochModulus = 3
  PacketModulus = 3
  MaxRecoveries = 1
  MaxWire = 2
  MaxFaults = 1
  ShutdownSteps = 2

INVARIANTS
  TypeOK
  SequenceMonotonic
  AtMostOneTransfer
  CanonicalHash
  DecisionNeverRegresses
  ApplyAndIrqAtMostOnce
  SharedReleaseBeforeAdmission
  CurrentIdentityOnly
  RecoveryPreservesCheckpoint
  QueuesBounded
  BackpressureNoDuplicateWork
  HotHorizonSafe
  ShutdownBounded
  CompatibleBeforeReady
  PreparedJoinerNeverCancelsLocally
  RecoveryRequestPreservesUncertainty

CHECK_DEADLOCK FALSE

VIEW ModelView
